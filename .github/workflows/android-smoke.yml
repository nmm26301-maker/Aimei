name: Android install smoke
on:
  workflow_run:
    workflows: ['Android APK']
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful Android APK workflow run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download the actual built APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.source_run }}
        run: gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name Aimei-Android-debug --dir dist
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise the APK on Android 13
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 33
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: python3 checks/android_smoke.py
