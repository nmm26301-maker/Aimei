name: Build Hongguo SafeSkip APK
on:
  push:
    branches: [ hongguo-safe-skip-apk ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Check rules
        run: |
          mkdir -p /tmp/rules
          javac -d /tmp/rules app/src/main/java/com/example/hongguosafeskip/SkipRules.java tests/SkipRulesTest.java
          java -cp /tmp/rules SkipRulesTest
      - name: Install Android SDK 34
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "Using $SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: HongguoSafeSkip-v0.2-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK for direct browser download
        run: |
          mkdir -p downloadable
          cp app/build/outputs/apk/debug/app-debug.apk downloadable/HongguoSafeSkip-v0.2.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloadable/HongguoSafeSkip-v0.2.apk
          git commit -m "build: publish downloadable APK [skip ci]" || echo "APK unchanged"
          git push origin HEAD:hongguo-safe-skip-apk
