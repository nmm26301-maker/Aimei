name: Android APK
on:
  push:
    branches: [main]
    paths:
      - '**/*.zip'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/gradle.properties'
      - '**/gradle-wrapper.properties'
      - '**/src/**'
      - 'scripts/**'
      - 'release-notes.md'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aimei-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AIMEI_TEST_KEYSTORE: ${{ runner.temp }}/aimei-signing/debug.keystore
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify source importer
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Find or import Android source
        id: project
        run: python3 scripts/import_android_source.py
      - name: Set up Java
        if: steps.project.outputs.ready == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        if: steps.project.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: ${{ steps.project.outputs.gradle_version }}
      - name: Preserve Android test signing identity
        if: steps.project.outputs.ready == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/aimei-signing
          key: aimei-test-signing-v2
      - name: Prepare Android test signing key
        if: steps.project.outputs.ready == 'true'
        run: |
          mkdir -p "$(dirname "$AIMEI_TEST_KEYSTORE")"
          if [ ! -f "$AIMEI_TEST_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$AIMEI_TEST_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Compile APK, run tests and Android lint
        if: steps.project.outputs.ready == 'true'
        working-directory: ${{ steps.project.outputs.directory }}
        run: gradle --no-daemon --stacktrace --console=plain assembleDebug testDebugUnitTest lintDebug
      - name: Verify signature and collect APK, checksums and source
        if: steps.project.outputs.ready == 'true'
        env:
          PROJECT_DIR: ${{ steps.project.outputs.directory }}
        run: python3 scripts/collect_android_artifacts.py
      - name: Upload APK and build files
        if: steps.project.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Aimei-Android-debug
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Back up test signing identity
        if: steps.project.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Aimei-test-signing
          path: ~/.android/debug.keystore
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Publish downloadable Android test build
        if: steps.project.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: aimei-v0.6.0-build-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS.txt dist/Aimei-built-source.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "爱美 0.6.0 安卓测试版" --notes-file release-notes.md --prerelease
      - name: Upload lint and test reports
        if: always() && steps.project.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Aimei-check-reports
          path: |
            ${{ steps.project.outputs.directory }}/**/build/reports/lint-results*
            ${{ steps.project.outputs.directory }}/**/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14
