name: Android APK
on:
  push:
    branches: [main]
    paths:
      - '**/*.zip'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/gradle.properties'
      - '**/gradle-wrapper.properties'
      - '**/src/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aimei-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify source importer
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Find or import Android source
        id: project
        run: python3 scripts/import_android_source.py
      - name: Set up Java
        if: steps.project.outputs.ready == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        if: steps.project.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: ${{ steps.project.outputs.gradle_version }}
      - name: Compile APK and run Android lint
        if: steps.project.outputs.ready == 'true'
        working-directory: ${{ steps.project.outputs.directory }}
        run: gradle --no-daemon --stacktrace --console=plain assembleDebug lintDebug
      - name: Collect APK, checksums and source snapshot
        if: steps.project.outputs.ready == 'true'
        env:
          PROJECT_DIR: ${{ steps.project.outputs.directory }}
        run: python3 scripts/collect_android_artifacts.py
      - name: Upload APK and build files
        if: steps.project.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Aimei-Android-debug
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload lint reports
        if: always() && steps.project.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Aimei-lint-reports
          path: ${{ steps.project.outputs.directory }}/**/build/reports/lint-results*
          if-no-files-found: ignore
          retention-days: 14
